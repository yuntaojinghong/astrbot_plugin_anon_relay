name: astrbot_plugin_anon_relay
display_name: 匿名倾诉转述
short_desc: 私聊开启匿名模式后，将倾诉内容以匿名身份转述到指定群聊（消息转述，非转发聊天记录）
desc: 用户私聊机器人发送「开启匿名模式」建立会话，之后发送的文字/图片会被机器人以匿名身份（如 匿名者-001）重新拼装成新消息转述到指定群聊。未开启时机器人保持沉默。支持多目标群、长文分段、图片转述、会话超时，全部行为可在插件设置面板中调整。
help: 私聊发送「开启匿名模式」开始倾诉；发送「关闭匿名模式」或「结束倾诉」结束。转述内容会以匿名身份出现在目标群聊中。
version: 1.1.1
author: guishe
repo: https://github.com/yuntaojinghong/astrbot_plugin_anon_relay
astrbot_version: ">=4.16,<5"
